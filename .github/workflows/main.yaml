name: Node.JS CI/CD

on:
  push:
    branches: [ main ]

jobs:
  
  test:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x, 24.x ]

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: use Node.JS ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: NPM install, build and test
        run:
          npm install
          npm test
        env:
          DBHOST: ${{ secrets.DBHOST }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}

deploy:
  name: Deploy
  needs: [ test ]
  runs-on: ubuntu-latest

  steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Add remote origin to Render
      run: git remote add render https://render:${{ secret.RENDER_API_KEY }}@git.render.com/${{ secrets.RENDER_APP_NAME }}.git

    - name: Deploy code to Render
      run: git push render main  